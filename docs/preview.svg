<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Inter,Segoe UI,system-ui,sans-serif">
  <rect width="900" height="560" fill="#07080a"/>
  <text x="24" y="34" font-size="16" font-weight="800" fill="#F4F5F7">SG Alfa — vista previa de la interfaz</text>
  <text x="24" y="54" font-size="12" fill="#6B7280">Mockup de la UI (la app aún no se ha probado en una TV real).</text>

  <!-- ===== Phone 1: Inicio ===== -->
  <g transform="translate(24,76)">
    <rect width="270" height="460" rx="28" fill="#0B0C0F" stroke="#20242c"/>
    <text x="22" y="52" font-size="22" font-weight="800" fill="#F4F5F7">Empecemos.</text>
    <text x="22" y="74" font-size="12" fill="#9BA1AC">¿Qué tele tienes?</text>
    <g>
      <rect x="18" y="92" width="234" height="86" rx="14" fill="#14161B" stroke="#23272F"/>
      <text x="34" y="120" font-size="13" font-weight="700" fill="#F4F5F7">📺 Android TV / Google TV</text>
      <text x="34" y="140" font-size="10.5" fill="#9BA1AC">TV box, Chromecast, decos…</text>
      <rect x="34" y="150" width="202" height="18" rx="9" fill="#34D399"/>
      <text x="135" y="163" font-size="10.5" font-weight="700" fill="#06281d" text-anchor="middle">Continuar</text>
    </g>
    <g>
      <rect x="18" y="190" width="234" height="60" rx="14" fill="#14161B" stroke="#23272F"/>
      <text x="34" y="216" font-size="13" font-weight="700" fill="#F4F5F7">📺 LG (webOS)</text>
      <text x="34" y="234" font-size="10.5" fill="#9BA1AC">Televisores LG</text>
    </g>
    <g>
      <rect x="18" y="262" width="234" height="60" rx="14" fill="#14161B" stroke="#23272F"/>
      <text x="34" y="288" font-size="13" font-weight="700" fill="#F4F5F7">📺 Samsung (Tizen)</text>
      <text x="34" y="306" font-size="10.5" fill="#9BA1AC">Televisores Samsung</text>
    </g>
  </g>

  <!-- ===== Phone 2: Limpiar ===== -->
  <g transform="translate(315,76)">
    <rect width="270" height="460" rx="28" fill="#0B0C0F" stroke="#20242c"/>
    <text x="135" y="86" font-size="58" font-weight="800" fill="#8ef5cc" text-anchor="middle">35</text>
    <text x="135" y="112" font-size="12" fill="#9BA1AC" text-anchor="middle">cosas que ensucian tu tele</text>
    <!-- stats -->
    <g>
      <rect x="18" y="130" width="72" height="56" rx="12" fill="#14161B" stroke="#23272F"/>
      <text x="54" y="158" font-size="16" font-weight="800" fill="#F4F5F7" text-anchor="middle">6</text>
      <text x="54" y="176" font-size="9.5" fill="#9BA1AC" text-anchor="middle">Anuncios</text>
      <rect x="99" y="130" width="72" height="56" rx="12" fill="#14161B" stroke="#23272F"/>
      <text x="135" y="158" font-size="16" font-weight="800" fill="#F4F5F7" text-anchor="middle">18</text>
      <text x="135" y="176" font-size="9.5" fill="#9BA1AC" text-anchor="middle">Te espían</text>
      <rect x="180" y="130" width="72" height="56" rx="12" fill="#14161B" stroke="#23272F"/>
      <text x="216" y="158" font-size="16" font-weight="800" fill="#F4F5F7" text-anchor="middle">11</text>
      <text x="216" y="176" font-size="9.5" fill="#9BA1AC" text-anchor="middle">De sobra</text>
    </g>
    <rect x="18" y="198" width="234" height="40" rx="14" fill="#34D399"/>
    <text x="135" y="223" font-size="14" font-weight="800" fill="#06281d" text-anchor="middle">✨  Limpiar ahora</text>
    <text x="135" y="256" font-size="9.5" fill="#6B7280" text-anchor="middle">Nada se borra para siempre.</text>
    <!-- lista -->
    <line x1="18" y1="272" x2="252" y2="272" stroke="#23272F"/>
    <text x="18" y="292" font-size="11" font-weight="800" fill="#34D399">📣 Anuncios · 6</text>
    <g font-family="monospace">
      <rect x="18" y="302" width="16" height="16" rx="4" fill="#34D399"/>
      <text x="44" y="314" font-size="10" fill="#F4F5F7">com.sony.dtv.advertisement</text>
      <text x="44" y="328" font-size="9" fill="#F87171">te espía · riesgo</text>
      <rect x="18" y="340" width="16" height="16" rx="4" fill="#34D399"/>
      <text x="44" y="352" font-size="10" fill="#F4F5F7">com.google.android.ads</text>
      <text x="44" y="366" font-size="9" fill="#F87171">te espía</text>
    </g>
  </g>

  <!-- ===== Phone 3: Launcher ===== -->
  <g transform="translate(606,76)">
    <rect width="270" height="460" rx="28" fill="#0B0C0F" stroke="#20242c"/>
    <text x="22" y="50" font-size="30" font-weight="800" fill="#FFFFFF">21:40</text>
    <text x="196" y="40" font-size="11" font-weight="700" fill="#34D399">● Anuncios</text>
    <text x="22" y="86" font-size="20" font-weight="800" fill="#FFFFFF">Tus apps</text>
    <!-- grid tiles -->
    <g>
      <rect x="18" y="104" width="110" height="62" rx="12" fill="#1B1E25"/>
      <rect x="140" y="100" width="118" height="70" rx="13" fill="#1B1E25" stroke="#E0312B" stroke-width="3"/>
      <rect x="18" y="180" width="110" height="62" rx="12" fill="#1B1E25"/>
      <rect x="140" y="180" width="110" height="62" rx="12" fill="#1B1E25"/>
      <rect x="18" y="256" width="110" height="62" rx="12" fill="#1B1E25"/>
      <rect x="140" y="256" width="110" height="62" rx="12" fill="#1B1E25"/>
      <text x="199" y="139" font-size="10" fill="#9BA1AC" text-anchor="middle">★ enfocada</text>
    </g>
    <rect x="18" y="356" width="120" height="30" rx="15" fill="none" stroke="#23272F"/>
    <text x="78" y="375" font-size="11" fill="#F4F5F7" text-anchor="middle">Ajustes</text>
  </g>
</svg>
